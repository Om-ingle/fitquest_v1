[pytest]
# M11 — put the API package root on sys.path so `app.*` and `tests.*` resolve
# the same way however pytest is invoked. Before this file existed the suite
# only imported `app` as a side effect of running `python -m pytest` from
# apps/api (which puts the current directory on sys.path); a bare `pytest`, or
# one run from the repository root, would fail to collect at all.
pythonpath = .
testpaths = tests
